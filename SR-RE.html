<script>/* Eclipse Foundry – a software-rendered arena. All art is drawn locally. */
(() => {
  'use strict';
  const TAU = Math.PI * 2;
  const fov = Math.tan(35 * Math.PI / 180);
  const map = Array.from({ length: 29 }, (_, y) =>
    Array.from({ length: 29 }, (_, x) => x === 0 || y === 0 || x === 28 || y === 28 ? 2 : 0));
  function block(x, y, w, h, tile) {
    for (let row = y; row < y + h; row++) map[row].fill(tile, x, x + w);
  }
  // Broken arcades leave several routes between the outer ring and the nave.
  for (const [x, y, w, h, tile] of [
    [4,3,4,2,2], [11,2,2,4,3], [18,3,5,2,1], [24,6,2,2,3],
    [4,8,2,2,3], [9,8,3,2,1], [16,7,2,3,2], [21,9,2,1,1],
    [2,17,2,3,1], [5,22,4,2,2], [11,20,2,4,3], [17,24,4,2,2],
    [20,18,3,2,1], [24,22,2,2,3], [9,12,1,1,3], [9,16,1,1,3],
    [16,12,1,1,3], [16,16,1,1,3], [24,12,1,1,3], [24,16,1,1,3]
  ]) block(x,y,w,h,tile);
  const start = {x:5.5,y:14.5,angle:0};
  function solid(x,y) {
    return (map[Math.floor(y)]?.[Math.floor(x)] ?? 2) !== 0;
  }
  function random(seed) {
    return () => { seed = (Math.imul(seed,1664525)+1013904223)>>>0; return seed / 4294967296; };
  }
  function surface(width,height) {
    const c=document.createElement('canvas'); c.width=width; c.height=height; return c;
  }
  function poly(ctx, points, fill, outline) {
    ctx.beginPath(); ctx.moveTo(points[0],points[1]);
    for(let i=2;i<points.length;i+=2) ctx.lineTo(points[i],points[i+1]);
    ctx.closePath(); ctx.fillStyle=fill;ctx.fill();
    if(outline) {ctx.strokeStyle=outline;ctx.lineWidth=1;ctx.stroke();}
  }
  function line(ctx,points,color,width) {
    ctx.beginPath();ctx.moveTo(points[0],points[1]);
    for(let i=2;i<points.length;i+=2) ctx.lineTo(points[i],points[i+1]);
    ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();
  }
  function pixels(c) {
    return new Uint32Array(c.getContext('2d').getImageData(0,0,c.width,c.height).data.buffer);
  }
  function speckle(ctx,w,h,r,n) {
    for(let i=0;i<n;i++){
      ctx.fillStyle=r()>.47?'rgba(255,221,173,.08)':'rgba(0,0,0,.15)';
      ctx.fillRect(r()*w,r()*h,1+r()*3,1+r()*2);
    }
  }
  const skyW=2048, skyH=360;
  function makeSky() {
    const c=surface(skyW,skyH),g=c.getContext('2d'),r=random(711);
    const grad=g.createLinearGradient(0,0,0,skyH);
    for(const [at,color] of [[0,'#0a131e'],[.36,'#273344'],[.67,'#8e625e'],[.84,'#d79a76'],[1,'#716268']]) grad.addColorStop(at,color);
    g.fillStyle=grad;g.fillRect(0,0,skyW,skyH);
    for(let i=0;i<800;i++){const y=r()*205;g.fillStyle='rgba(250,229,195,'+(.04+r()*.55)*(1-y/240)+')';g.fillRect(r()*skyW,y,r()>.95?2:1,1);}
    // The eclipsed star is world-anchored, visible beyond the east gate.
    const sx=1065,sy=247,sr=33;
    const halo=g.createRadialGradient(sx,sy,sr*.8,sx,sy,130);
    halo.addColorStop(0,'#ffdf99');halo.addColorStop(.13,'#ffc283bc');halo.addColorStop(.34,'#ec846647');halo.addColorStop(1,'#f7a16d00');
    g.fillStyle=halo;g.fillRect(sx-130,sy-130,260,260);
    g.fillStyle='#ffe1a3';g.beginPath();g.arc(sx,sy,sr+1.7,0,TAU);g.fill();
    const disc=g.createLinearGradient(0,sy-sr,0,sy+sr);
    disc.addColorStop(0,'#323340');disc.addColorStop(1,'#ad7161');
    g.fillStyle=disc;g.beginPath();g.arc(sx-.8,sy-1.2,sr,0,TAU);g.fill();
    for(let i=0;i<110;i++){
      const x=r()*skyW,y=180+r()*115,w=10+r()*115;
      g.fillStyle=r()>.4?'#c7a5a018':'#25334820';g.fillRect(x,y,w,1+r()*2);
    }
    for(let layer=0;layer<3;layer++){
      const floor=302+layer*18;
      g.fillStyle=['#896d70','#655b63','#44434d'][layer];
      g.beginPath();g.moveTo(0,skyH);
      for(let x=0;x<=skyW;x+=4){
        const a=x*TAU/skyW;
        const n=Math.sin(a*9+layer*2)*9+Math.sin(a*23+layer)*5+Math.abs(Math.sin(a*3+layer))*19;
        g.lineTo(x,floor-n-r()*4);
      }
      g.lineTo(skyW,skyH);g.fill();
      if(layer===0)continue;
      // Stacks, suspension gantries and flaring reactor spires.
      for(let i=0;i<57;i++){
        const x=r()*skyW,y=floor-10,h=10+r()*42,w=3+r()*12;
        const col=layer===1?'#70626a':'#514a53';
        g.fillStyle=col;g.fillRect(x,y-h,w,h+15);
        poly(g,[x-2,y-h+4,x+w*.5,y-h-18,x+w+2,y-h+4],col);
        g.fillRect(x+w*.52,y-h-23,1,24);
        if(i%4===0)line(g,[x+w,y-h+3,x+w+12,y-h+10,x+w+28,y-h+4],col,1);
        if(i%3===0){g.fillStyle='#d9a484';g.fillRect(x+w*.53,y-h-23,1.6,1);}
      }
    }
    return pixels(c);
  }
  function lighting(data,fog) {
    const table=[];
    for(let n=0;n<16;n++){
      const a=1-n/19, d=new Uint32Array(data.length);
      for(let i=0;i<data.length;i++){
        const v=data[i];
        const rr=((v&255)*a+fog[0]*(1-a))|0;
        const gg=(((v>>>8)&255)*a+fog[1]*(1-a))|0;
        const bb=(((v>>>16)&255)*a+fog[2]*(1-a))|0;
        d[i]=0xff000000|(bb<<16)|(gg<<8)|rr;
      } table.push(d);
    }return table;
  }
  const texW=64,texH=128;
  function wallTexture(kind) {
    const c=surface(texW,texH),g=c.getContext('2d'),r=random(111+kind);
    const gradient=g.createLinearGradient(0,0,64,110);
    gradient.addColorStop(0,'#7e7370');gradient.addColorStop(.5,'#504b50');gradient.addColorStop(1,'#302f38');
    g.fillStyle=gradient;g.fillRect(0,0,64,128);
    const rect=(x,y,w,h,col)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
    if(kind===1){
      // Armoured freight casings, hazard band and recessed catches.
      rect(3,8,58,104,'#272d34');rect(6,12,52,96,'#715e4c');
      for(let i=0;i<5;i++){rect(8+i*10,16,4,80,'#51483e');rect(9+i*10,16,1,80,'#877363');}
      for(let i=0;i<2;i++){const y=14+i*73;line(g,[7,y,56,y+16],'#312e30',6);line(g,[7,y-1,56,y+15],'#a18769',2);}
      rect(5,106,54,7,'#c8a064');
      for(let i=3;i<60;i+=12)poly(g,[i,106,i+6,106,i+1,113,i-4,113],'#3e3837');
    }else if(kind===2){
      rect(3,7,58,106,'#413f47');
      poly(g,[8,101,8,40,20,17,44,17,56,40,56,101],'#272d37','#847675');
      poly(g,[13,99,13,43,23,25,41,25,51,43,51,99],'#48454b');
      for(let i=0;i<12;i++){rect(18,44+i*4,28,2,'#222a33');rect(18,44+i*4,27,1,'#625b5b');}
      rect(23,29,18,3,'#ae7658');rect(25,30,14,1,'#ffc691');
      rect(5,106,54,2,'#918077');
    }else{
      for(let i=0;i<3;i++){rect(7+i*18,2,12,114,'#35343b');rect(8+i*18,3,2,111,'#8b7d71');}
      rect(1,14,62,7,'#242730');rect(2,14,60,2,'#988575');rect(1,85,62,8,'#282c33');
      rect(23,26,19,50,'#272933');rect(29,29,6,39,'#bd7650');rect(30,30,3,35,'#ffd295');rect(28,30,1,36,'#ffe0ad');
      for(let y=32;y<69;y+=8)rect(27,y,10,2,'#7c513d');
    }
    rect(0,0,64,3,'#a39382');rect(0,3,64,2,'#39363e');
    rect(0,119,64,4,'#22272e');rect(0,118,64,1,'#80746c');
    rect(0,0,2,128,'#36353a');rect(62,1,2,126,'#222830');
    for(const x of [4,58])for(const y of [6,116]){rect(x,y,2,2,'#22272b');rect(x,y,1,1,'#bbab96');}
    for(let i=0;i<48;i++){let x=r()*64,y=r()*120;rect(x,y,1,3+r()*11,'#251b241b');}
    speckle(g,64,128,r,760);return lighting(pixels(c),[57,52,57]);
  }
  function groundTexture(road) {
    const c=surface(64,64),g=c.getContext('2d'),r=random(130+road);
    g.fillStyle=road?'#524b4c':'#4b484b';g.fillRect(0,0,64,64);
    g.fillStyle='#33343b';g.fillRect(0,0,64,1);g.fillRect(0,0,1,64);
    g.fillStyle='#736a63';g.fillRect(1,1,63,1);g.fillRect(1,2,1,62);
    if(road===1){g.fillStyle='#c7a077';g.fillRect(1,10,54,2);g.fillStyle='#8f755b';g.fillRect(0,16,64,1);}
    if(road===2){g.fillStyle='#262d37';g.fillRect(8,9,48,43);for(let x=10;x<54;x+=4){g.fillStyle='#625c59';g.fillRect(x,10,2,41);}}
    for(let i=0;i<32;i++){const x=r()*64,y=r()*64;line(g,[x,y,x+r()*4,y-r()*3],'#2a282d38',1);}
    speckle(g,64,64,r,400);return lighting(pixels(c),[79,72,74]);
  }

    let sway=0, walk=0, step=0, lastRun=null, shotNumber=0;

    function drawWeapon(ctx,w,h,g,input={},dt=1/60) {
        if (!g || !w || !h) return;
        if(lastRun !== g){lastRun=g;sway=0;walk=0;step=0;shotNumber=0}
        const delta=clamp(dt||0,1/240,1/12);
        const moving=clamp(g.speed ?? Math.hypot(input.forward||0,input.strafe||0),0,1);
        walk+=(moving-walk)*(1-Math.exp(-9*delta));

                const a=i*TAU/12+seed;
                const r=(i%2?4:11+7*Math.sin(i+seed))*flash;
                const fx=x+Math.cos(a)*r-5*flash,fy=y+Math.sin(a)*r-5*flash;

        if (g.loadout==='rail' || g.loadout==='arc' || g.ranks?.power || g.ranks?.arc || g.ranks?.nova) {

            const strength=Math.max(g.ranks?.power||0,g.ranks?.arc||0,g.ranks?.nova||0);

            // The streaks start at the periphery, leaving the aim point clear.

                const start=.74+.11*Math.sin(i);

    let audio=null, mix=null, noiseBuffer=null, enabled=true;

    function unlockGameSound(){

                const values=noiseBuffer.getChannelData(0);

        }catch { /* Browsers without an active audio device still run the game. */ }

    function tone(t,start,end,duration,volume,type='sine'){

        gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(volume,t+.004);
        gain.gain.exponentialRampToValueAtTime(.0001,t+duration);

        const source=audio.createBufferSource(),filter=audio.createBiquadFilter(),gain=audio.createGain();
        source.buffer=noiseBuffer;filter.type='bandpass';filter.Q.value=q;
        filter.frequency.setValueAtTime(center,t);filter.frequency.exponentialRampToValueAtTime(end,t+duration);
        gain.gain.setValueAtTime(.0001,t);gain.gain.exponentialRampToValueAtTime(volume,t+.003);
        gain.gain.exponentialRampToValueAtTime(.0001,t+duration);
        source.connect(filter);filter.connect(gain);gain.connect(mix);source.start(t);source.stop(t+duration);
    }

        case 'shot':

        case 'hit':
            air(t,3900,1700,.058,.46,2.4);tone(t,1080,590,.064,.16,'triangle');break;
        case 'kill':
            air(t,2200,190,.21,.65);tone(t,320,60,.18,.33,'triangle');
            tone(t+.038,1150,780,.095,.19);break;
        case 'gem':
            tone(t,630,725,.084,.19);tone(t+.028,1040,1110,.11,.14);break;
        case 'hurt':
            tone(t,113,43,.25,.49,'sawtooth');air(t,1100,220,.18,.38);break;
        case 'dash':

    if(!g||g.state!=='playing'||panel)return;
    dialog('pause','PAUSED','작전 일시정지');
    el('panelActions').append(btn('전투 계속',resume,true),btn('설정',settings),btn('작전 종료',confirmExit));
}
function confirmExit(){
    dialog('exit','ABORT MISSION','작전을 종료할까요?','이번 출격의 기록과 강화가 저장되지 않습니다.');
    el('panelActions').append(btn('전투 계속',resume,true),btn('메인 메뉴로',toMenu));
}
function back(){if(g){closeDialog();pause();}else{closeDialog();el('deploy').focus();}}
function guide(){
    dialog('guide','FIELD MANUAL','조작 안내','시야 중앙에 적을 두면 자동 사격합니다. 청록색 코어를 모을 때마다 무기를 강화할 기회가 생깁니다.');
    const rows=touchMode?[['이동','왼쪽 조이스틱'],['시점 회전','화면 오른쪽 드래그'],['수동 사격 · 대시','오른쪽 버튼']]:[['이동','W A S D'],['시점 회전','마우스 또는 ← →'],['수동 사격','마우스 왼쪽 또는 F'],['대시','Shift 또는 Space'],['일시정지','Esc 또는 P']];
    rows.push(['게임패드','왼쪽 스틱 이동 · 오른쪽 스틱 조준 · RT 발사 · A 대시']);
    rows.forEach(([a,b])=>row(el('panelBody'),'guide-row',a,b));
    el('panelActions').append(btn('닫기',back,true));
}
function settings(){
    dialog('settings','OPTIONS','작전 설정');
    const list=el('panelBody');
    const sound=btn('',()=>{profile.sound=!profile.sound;window.unlockGameSound();window.setGameSound(profile.sound);sound.textContent=profile.sound?'켜짐':'꺼짐';save();});
    sound.textContent=profile.sound?'켜짐':'꺼짐';row(list,'setting','전체 소리',sound);
    const music=btn(profile.music?'켜짐':'꺼짐',()=>{profile.music=!profile.music;window.setGameMusic(profile.music);music.textContent=profile.music?'켜짐':'꺼짐';save();});
    row(list,'setting','전투 음악',music);
    const slider=document.createElement('input');slider.type='range';slider.min='.4';slider.max='2.2';slider.step='.1';slider.value=profile.sensitivity;slider.setAttribute('aria-label','시점 감도');
    slider.oninput=()=>{profile.sensitivity=+slider.value;save();};row(list,'setting','시점 감도',slider);
    const quality={auto:'자동',high:'높음',low:'낮음'};
    const qualityBtn=btn(quality[profile.detail],()=>{profile.detail=({auto:'high',high:'low',low:'auto'})[profile.detail];qualityBtn.textContent=quality[profile.detail];resize();save();});
    row(list,'setting','렌더링 해상도',qualityBtn);
    if(document.fullscreenEnabled){const full=btn(document.fullscreenElement?'전체 화면 종료':'전체 화면',async()=>{
        try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();full.textContent=document.fullscreenElement?'전체 화면 종료':'전체 화면';}catch{full.textContent='전체 화면 사용 불가';}
    });row(list,'setting','디스플레이',full);}
    el('panelActions').append(btn('완료',back,true));
}
function choose(index){
    if(panel!=='upgrade'||!g?.choices?.[index])return;
    Combat.choose(g,index);closeDialog();hudTime=0;last=performance.now();resumeGrace=last+400;lock();
}
function upgrade(){
    dialog('upgrade','CORE SYNCHRONIZED','코어 강화','다음 전투에 적용할 강화 하나를 선택하세요.');
    g.choices.forEach((choice,i)=>{
        const button=btn('',()=>choose(i));button.className='choice';
        for(const [tag,txt] of [['b','0'+(i+1)],['strong',choice.name],['small',choice.desc]]){
            const item=document.createElement(tag);item.textContent=txt;button.append(item);
        }
        el('panelBody').append(button);
    });
}
function report(){
    const won=g.state==='won';profile.runs++;profile.wins+=Number(won);profile.bestTime=Math.max(profile.bestTime,g.time);profile.bestKills=Math.max(profile.bestKills,g.kills);save();
    dialog('report',won?'CITADEL SECURED':'SIGNAL LOST',won?'성채 돌파':'신호 두절',won?'마지막 파수꾼이 쓰러졌습니다. 작전을 완료했습니다.':'슈트의 신호가 끊겼습니다. 다음 출격에서 새로운 강화 조합을 시도하세요.');
    [['생존 시간',asTime(g.time)],['처치',String(g.kills)],['도달 웨이브',two(g.wave)],['코어 레벨',String(g.level)]].forEach(([a,b])=>row(el('panelBody'),'stats-row',a,b));
    el('panelActions').append(btn('재출격',newRun,true),btn('메인 메뉴',toMenu));
}
function fill(selector,value){document.querySelector(selector).style.transform='scaleX('+Math.max(0,Math.min(1,value))+')';}
function drawRadar(){
    const w=110,c=55,k=5;
    radar.clearRect(0,0,w,w);radar.save();radar.beginPath();radar.arc(c,c,51,0,7);radar.clip();radar.fillStyle='#0a151cd4';radar.fillRect(0,0,w,w);
    radar.translate(c,c);radar.rotate(-Math.PI/2-g.player.angle);
    radar.fillStyle='#536063';
    for(let y=Math.max(0,Math.floor(g.player.y-11));y<Math.min(World.map.length,g.player.y+12);y++){
        for(let x=Math.max(0,Math.floor(g.player.x-11));x<Math.min(World.map[y].length,g.player.x+12);x++)if(World.map[y][x])radar.fillRect((x-g.player.x)*k,(y-g.player.y)*k,k+.15,k+.15);
    }
    for(const e of g.entities){
        if(e.kind==='bolt')continue;
        const size=e.kind==='boss'?5:e.kind==='gem'?2:3;
        radar.fillStyle=e.kind==='gem'?'#87ecda':'#ff9868';radar.fillRect((e.x-g.player.x)*k-size/2,(e.y-g.player.y)*k-size/2,size,size);
    }
    radar.restore();radar.strokeStyle='#bbc7bb88';radar.beginPath();radar.arc(c,c,51,0,7);radar.stroke();radar.fillStyle='#fff3d6';radar.beginPath();radar.moveTo(c,c-5);radar.lineTo(c-3,c+3);radar.lineTo(c+3,c+3);radar.fill();
}
function updateHUD(){
    el('wave').textContent='WAVE '+two(g.wave);el('clock').textContent=asTime(g.time);
    el('objective').textContent=g.time<7?(touchMode?'왼쪽 이동 · 오른쪽 드래그 조준':'WASD 이동 · 마우스 조준 · Shift 대시'):g.time<g.bossAt?'파수꾼 출현까지 '+asTime(Math.ceil(g.bossAt-g.time)):'파수꾼을 처치하세요';
    el('hp').textContent=Math.ceil(Math.max(0,g.player.hp));el('maxHp').textContent='/ '+Math.round(g.player.maxHp);
    fill('.health i',g.player.hp/g.player.maxHp);el('dashStatus').textContent=g.dashReady>0?'대시 충전 '+g.dashReady.toFixed(1)+'s':'대시 준비';
    el('kills').textContent=String(g.kills).padStart(3,'0');el('level').textContent='LV '+two(g.level);fill('.xp i',g.xp/g.xpNeed);
    const boss=g.boss;el('bossBar').hidden=!boss||boss.hp<=0;if(boss)fill('#bossBar i',boss.hp/boss.maxHp);
    if(lastWave!==g.wave){lastWave=g.wave;el('waveNotice').textContent=g.wave===5?'WARDEN':'WAVE '+two(g.wave);el('waveNotice').hidden=false;noticeUntil=g.time+2;}
    if(g.time>=noticeUntil)el('waveNotice').hidden=true;
    drawRadar();
}
const controller={buttons:[],x:0,y:0,turn:0,tilt:0,fire:false,dash:false};
function pollController(){
    let pad;
    try{pad=Array.from(navigator.getGamepads?.()||[]).find(p=>p?.mapping==='standard');}catch{}
    controller.x=controller.y=controller.turn=controller.tilt=0;controller.fire=controller.dash=false;
    if(!pad){controller.buttons=[];return;}
    const previous=controller.buttons;
    const buttons=pad.buttons.map(b=>b.pressed);controller.buttons=buttons;
    const pressed=i=>buttons[i]&&!previous[i];
    const axis=i=>{const v=pad.axes[i]||0;return Math.abs(v)<.17?0:Math.sign(v)*(Math.abs(v)-.17)/.83;};
    if(panel||!g){
        const list=[...(panel?overlay:home).querySelectorAll('button,input')];
        const pos=list.indexOf(document.activeElement);
        const fwd=pressed(13)||pressed(15),rev=pressed(12)||pressed(14);
        if(list.length&&(fwd||rev))list[(pos+(fwd?1:-1)+list.length)%list.length].focus();
        if(pressed(0)){const target=list.includes(document.activeElement)?document.activeElement:(panel?list[0]:el('deploy'));target?.click();}
        else if(pressed(1)||pressed(9)){if(panel==='pause')resume();else if(['guide','settings','armory','exit'].includes(panel))back();}
        return;
    }
    if(pressed(9)){pause();return;}
    controller.x=axis(0);controller.y=axis(1);controller.turn=axis(2);controller.tilt=axis(3);
    controller.fire=buttons[7];controller.dash=pressed(0)||pressed(4);
}
function frame(now){
    const elapsed=last?(now-last)/1000:0;last=now;const dt=Math.min(.045,elapsed);
    if(!document.hidden){
        pollController();window.musicFrame(g&&!panel&&g.state==='playing'?g:null);
        if(!g){
            simClock+=dt;if(!panel&&(!demo.drawn||simClock-demo.drawn>1/28)){demo.drawn=simClock;demo.time=simClock;demo.player.angle=.04+.09*Math.sin(simClock*.13);
            World.draw(ctx,canvas.width,canvas.height,demo);}
        }else if(!panel){
            input.forward=Number(keySet.has('KeyW')||keySet.has('ArrowUp'))-Number(keySet.has('KeyS')||keySet.has('ArrowDown'))-joyY-controller.y;
            input.strafe=Number(keySet.has('KeyD'))-Number(keySet.has('KeyA'))+joyX+controller.x;
            input.turn=look+(Number(keySet.has('ArrowRight'))-Number(keySet.has('ArrowLeft')))*dt*2.35+controller.turn*dt*2.85*profile.sensitivity;look=0;
            input.fire=mouseDown||touchFire||keySet.has('KeyF')||controller.fire;input.dash=queuedDash||controller.dash;queuedDash=false;
            const focus=canvas.width/(2*Math.tan(35*Math.PI/180));
            const limit=.34*canvas.height/focus;
            g.aimSlope=Math.max(-limit,Math.min(limit,(g.aimSlope||0)-verticalLook-controller.tilt*dt*1.6*profile.sensitivity));
            g.horizon=.5+g.aimSlope*focus/canvas.height;
            verticalLook=0;
            Combat.update(g,dt,input);
            g.bob=Math.sin(g.time*10)*Math.min(1,Math.hypot(input.forward,input.strafe))*.0025;
            World.draw(ctx,canvas.width,canvas.height,g);
            window.drawCombatEffects(ctx,canvas.width,canvas.height,g);
            window.drawWeapon(ctx,canvas.width,canvas.height,g,input,dt);
            hudTime-=dt;if(hudTime<=0){updateHUD();hudTime=.09;}
            if(g.state==='upgrade')upgrade();else if(g.state==='lost'||g.state==='won')report();
            if(profile.detail==='auto'){
                framesSlow=elapsed>.035?framesSlow+1:Math.max(0,framesSlow-1);
                if(framesSlow>40&&renderScale>.66){renderScale=Math.max(.65,renderScale-.12);resize();framesSlow=0;}
            }
        }
    }
    requestAnimationFrame(frame);
}
function setTouch(){if(!touchMode){touchMode=true;touchUI();}}
el('armory').onclick=armory;updateModule();el('deploy').onclick=newRun;el('pause').onclick=pause;el('settingsOpen').onclick=settings;el('guideOpen').onclick=guide;
window.addEventListener('keydown',e=>{
    if(panel){if(e.key==='Tab'){
        const list=[...overlay.querySelectorAll('button,input')];if(!list.length)return;
        if(e.shiftKey&&document.activeElement===list[0]){e.preventDefault();list.at(-1).focus();}
        else if(!e.shiftKey&&document.activeElement===list.at(-1)){e.preventDefault();list[0].focus();}
    }
    if(e.repeat)return;
    if(panel==='upgrade'&&['1','2','3'].includes(e.key)){choose(+e.key-1);return;}
    if(e.key==='Escape'){if(panel==='pause')resume();else if(['guide','settings','armory','exit'].includes(panel))back();}
    return;}
    if(!g)return;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
    keySet.add(e.code);if(!e.repeat){if(e.code==='KeyP'||e.code==='Escape')pause();else if(['ShiftLeft','ShiftRight','Space'].includes(e.code))queuedDash=true;}
});
window.addEventListener('keyup',e=>keySet.delete(e.code));
canvas.addEventListener('pointerdown',e=>{
    if(!g||panel)return;
    if(e.pointerType==='touch'){setTouch();if(dragId!==null)return;dragId=e.pointerId;dragX=e.clientX;dragY=e.clientY;canvas.setPointerCapture(e.pointerId);}
    else if(e.button===0){mouseDown=true;if(document.pointerLockElement!==canvas){dragId=e.pointerId;dragX=e.clientX;dragY=e.clientY;lock();}}
});
window.addEventListener('mousemove',e=>{if(!panel&&g&&document.pointerLockElement===canvas){look+=e.movementX*.0024*profile.sensitivity;verticalLook+=e.movementY*.0019*profile.sensitivity;}});
canvas.addEventListener('pointermove',e=>{
    if(!g||panel||dragId!==e.pointerId||document.pointerLockElement===canvas)return;
    const sensitivity=(e.pointerType==='touch'?.006:.004)*profile.sensitivity;look+=(e.clientX-dragX)*sensitivity;verticalLook+=(e.clientY-dragY)*sensitivity*.7;dragX=e.clientX;dragY=e.clientY;
});
function endPointer(e){if(e.pointerType!=='touch')mouseDown=false;if(e.pointerId===dragId)dragId=null;}
window.addEventListener('pointerup',endPointer);window.addEventListener('pointercancel',endPointer);
const pad=el('movePad');let stickId=null;
function moveStick(e){const r=pad.getBoundingClientRect();const dx=(e.clientX-r.left-r.width/2)/(r.width*.4),dy=(e.clientY-r.top-r.height/2)/(r.height*.4);const len=Math.max(1,Math.hypot(dx,dy));joyX=dx/len;joyY=dy/len;pad.firstElementChild.style.transform='translate('+joyX*22+'px,'+joyY*22+'px)';}
pad.onpointerdown=e=>{if(stickId!==null)return;stickId=e.pointerId;pad.setPointerCapture(stickId);moveStick(e);};
pad.onpointermove=e=>{if(e.pointerId===stickId)moveStick(e);};
pad.onlostpointercapture=()=>{stickId=null;joyX=joyY=0;pad.firstElementChild.style.transform='';};
el('fireBtn').onpointerdown=e=>{e.currentTarget.setPointerCapture(e.pointerId);touchFire=true;};
el('fireBtn').onlostpointercapture=()=>touchFire=false;
el('dashBtn').onpointerdown=()=>queuedDash=true;
document.addEventListener('pointerlockchange',()=>{
    const locked=document.pointerLockElement===canvas;
    if(wasLocked&&!locked&&!panel&&g&&performance.now()>resumeGrace)pause();
    wasLocked=locked;
});
window.addEventListener('blur',()=>{clearInput();if(g&&!panel)pause();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){clearInput();pause();window.musicFrame(null);}});
window.addEventListener('resize',resize);
document.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')setTouch();},{capture:true});
resize();records();touchUI();requestAnimationFrame(frame);
})();
</script>
</body></html>
